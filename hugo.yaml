  description: "Just a website."
  footer: "&copy; [Ennis Kerr](https://reallybigmess.github.io) {Year} | [Github](https://github.com/reallybigmess)"

markup:
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)

caches:
  images:
    dir: :cacheDir/images
